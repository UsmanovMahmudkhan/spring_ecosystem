<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
</head>
<body>

<div th:each="product : ${products}">
  <h1>Name: <span th:text="${product.getProductName()}">Name</span>, </h1>
  <h1>Price: <span th:text="${product.getPrice()}">Price</span>, </h1>
  <h1>Quantity: <span th:text="${product.getQuantity()}">quantity</span></h1>

</div>

</body>
</html>
