spring.application.name=MapStruct-mapping
# Database URL, host, port, and schema name
spring.datasource.url=jdbc:mysql://localhost:3306/items

# Database credentials
spring.datasource.username=root
spring.datasource.password=mahmudxon

# MySQL Driver class (Optional in modern Spring Boot; auto-detected)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate DDL strategy (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in the console log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
