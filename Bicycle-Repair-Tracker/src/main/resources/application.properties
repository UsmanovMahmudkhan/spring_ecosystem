spring.application.name=Bicycle-Repair-Tracker
# Database Connection URL (Replace 'your_database_name' with your actual schema name)
spring.datasource.url=jdbc:mysql://localhost:3306/bycle

# Database Credentials
spring.datasource.username=root
spring.datasource.password=test123

# MySQL Driver Class Name (Optional for modern Spring Boot versions, it auto-detects it)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate DDL Auto-creation strategy (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries executed by Hibernate in the console log
spring.jpa.show-sql=true

# Format the console SQL output nicely
spring.jpa.properties.hibernate.format_sql=true
